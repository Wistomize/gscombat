name: gscombat

services:
  api:
    build:
      context: .
      target: api
    environment:
      INVITE_TOKEN_SECRET: ${INVITE_TOKEN_SECRET:?INVITE_TOKEN_SECRET is required}
      NODE_ENV: production
      PORT: 3001
      SESSION_COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      WORKSPACE_DATA_PATH: /data/workspaces.sqlite
    expose:
      - "3001"
    healthcheck:
      interval: 20s
      retries: 5
      start_period: 20s
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      timeout: 5s
    restart: unless-stopped
    volumes:
      - ./runtime/workspace:/data

  web:
    build:
      args:
        SITE_FOOTER_CONTACT: ${SITE_FOOTER_CONTACT:-}
        SITE_FOOTER_GITHUB_URL: ${SITE_FOOTER_GITHUB_URL:-}
        SITE_ICP_RECORD: ${SITE_ICP_RECORD:-}
        SITE_ICP_RECORD_URL: ${SITE_ICP_RECORD_URL:-}
        SITE_PUBLIC_SECURITY_RECORD: ${SITE_PUBLIC_SECURITY_RECORD:-}
        SITE_PUBLIC_SECURITY_RECORD_URL: ${SITE_PUBLIC_SECURITY_RECORD_URL:-}
      context: .
      target: web
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:3001
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3200
      SITE_FOOTER_CONTACT: ${SITE_FOOTER_CONTACT:-}
      SITE_FOOTER_GITHUB_URL: ${SITE_FOOTER_GITHUB_URL:-}
      SITE_ICP_RECORD: ${SITE_ICP_RECORD:-}
      SITE_ICP_RECORD_URL: ${SITE_ICP_RECORD_URL:-}
      SITE_PUBLIC_SECURITY_RECORD: ${SITE_PUBLIC_SECURITY_RECORD:-}
      SITE_PUBLIC_SECURITY_RECORD_URL: ${SITE_PUBLIC_SECURITY_RECORD_URL:-}
    expose:
      - "3200"
    healthcheck:
      interval: 20s
      retries: 5
      start_period: 20s
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      timeout: 5s
    restart: unless-stopped

  proxy:
    image: caddy:2.10.2-alpine
    depends_on:
      web:
        condition: service_healthy
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-gscombat.online}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./runtime/caddy/data:/data
      - ./runtime/caddy/config:/config
