packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tarojs/binding': true
  '@tarojs/binding-darwin-arm64': true
  '@tarojs/cli': true
  core-js: true
  core-js-pure: true
  esbuild: true
  sharp: true
  unrs-resolver: true

linkWorkspacePackages: true
strictPeerDependencies: true
